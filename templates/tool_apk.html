{% extends "base.html" %}
{% block content %}

<style id="global-zero-white-override">
  /* Force dark theme on root, body, and all containers */
  html, body {
    background-color: #070b14 !important;
    color: #f1f5f9 !important;
  }
  /* Target Login, Signup, Auth Cards, Modals, Panels, and White Boxes */
  .auth-card, .login-card, .signup-card, .auth-box, .login-box, .signup-box,
  .card, .panel, .modal-content, .box, .container-box, .form-container,
  div[class*="white"], div[style*="255, 255, 255"], div[style*="#fff"], div[style*="white"] {
    background: #111827 !important;
    background-color: #111827 !important;
    color: #f1f5f9 !important;
    border: 1px solid rgba(56, 189, 248, 0.28) !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
  }
  /* Target ALL Inputs, Password fields, Emails, Textareas, Selects */
  input, input[type="text"], input[type="password"], input[type="email"],
  input[type="number"], input[type="search"], input[type="url"],
  textarea, select, .form-control, .form-input {
    background: #030712 !important;
    background-color: #030712 !important;
    color: #38bdf8 !important;
    border: 1px solid #334155 !important;
    border-radius: 10px !important;
    caret-color: #38bdf8 !important;
  }
  input::placeholder, textarea::placeholder {
    color: #64748b !important;
  }
  /* Fix Chrome/Mobile White/Yellow Autofill Background on Login & Signup */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 40px #030712 inset !important;
    -webkit-text-fill-color: #38bdf8 !important;
    transition: background-color 5000s ease-in-out 0s !important;
  }
  /* Fix Labels, Headings, and Links inside Login/Signup */
  label, .form-label, h1, h2, h3, h4, h5, h6, th {
    color: #f8fafc !important;
  }
  p, span, td, small {
    color: #cbd5e1;
  }
  /* Fix White Buttons -> Cyber Neon Buttons */
  button, input[type="submit"], .btn, .submit-btn, .login-btn, .auth-btn {
    background: linear-gradient(135deg, #0284c7, #2563eb) !important;
    color: #ffffff !important;
    border: 1px solid rgba(56, 189, 248, 0.4) !important;
    font-weight: 700 !important;
  }
  /* Fix Tables, Code blocks, Token Pills, Alerts */
  table, tr, td, th, tbody, thead {
    background-color: transparent !important;
    color: #e2e8f0 !important;
    border-color: #1e293b !important;
  }
  pre, code, .token-box, .alert {
    background-color: #030712 !important;
    color: #4ade80 !important;
    border: 1px solid rgba(74, 222, 128, 0.3) !important;
  }
</style>

<div style="max-width: 900px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div class="card" style="padding: 28px; border-radius: 20px; margin-bottom: 24px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #eab308; background: rgba(234, 179, 8, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.25);">
            APK AUDITOR (STATIC ANALYSIS)
        </span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #ffffff; margin: 12px 0 6px;">APK Package Inspector</h1>
        <p style="color: #94a3b8; font-size: 0.92rem; margin: 0;">Upload an APK to statically inspect package files, DEX containers, and resource counts.</p>

        <div style="margin-top: 24px; display: flex; gap: 10px;">
            <input type="file" id="apkFileInput" accept=".apk" 
                style="flex: 1; padding: 10px; border-radius: 12px; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 0.9rem;">
            <button onclick="uploadAndInspect()" id="uploadBtn" 
                style="padding: 12px 24px; background: #eab308; border: none; border-radius: 12px; color: #020617; font-weight: 700; font-size: 0.9rem; cursor: pointer;">
                Inspect Binary
            </button>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card" style="padding: 24px; border-radius: 20px;">
        <h3 style="color: #ffffff; font-size: 1.05rem; margin: 0 0 12px;">Inspection Summary</h3>
        <div style="background: rgba(5, 9, 17, 0.95); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px;">
            <pre id="apkViewer" style="margin: 0; color: #eab308; font-family: monospace; font-size: 0.88rem; white-space: pre-wrap;">// Upload an APK file to view archive structure...</pre>
        </div>
    </div>
</div>

<script>
async function uploadAndInspect() {
    const fileField = document.getElementById('apkFileInput');
    const viewer = document.getElementById('apkViewer');
    const btn = document.getElementById('uploadBtn');

    if(!fileField.files[0]) return alert("Please select an .apk file");

    const formData = new FormData();
    formData.append('file', fileField.files[0]);

    btn.disabled = true;
    viewer.innerText = "// Parsing archive containers...";

    try {
        const resp = await fetch('/tools/apk-inspector', {
            method: 'POST',
            body: formData
        });
        const res = await resp.json();
        viewer.innerText = JSON.stringify(res, null, 2);
    } catch(err) {
        viewer.innerText = "// Audit inspection error: " + err.message;
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
