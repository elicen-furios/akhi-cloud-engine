<style id="global-zero-white-override">
  * {
    font-family: 'Space Grotesk', sans-serif !important;
    box-sizing: border-box;
  }
  html, body {
    background-color: #060913 !important;
    color: #e2e8f0 !important;
  }
  /* Fix invisible headings, brand names, and session titles */
  h1, h2, h3, h4, .brand, .logo, header a, nav a, .navbar-brand, .session-title {
    font-family: 'Orbitron', sans-serif !important;
    color: #38bdf8 !important;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.35) !important;
    opacity: 1 !important;
  }
  /* Fix top-right user pill (JITENDRA CHAND) and secondary buttons (Access Vault, Copy Output) */
  header span, header div, .user-badge, .profile-btn, a.btn, button, .btn {
    color: #38bdf8 !important;
    border-color: rgba(56, 189, 248, 0.45) !important;
    opacity: 1 !important;
  }
  /* Make all buttons and action links clearly visible with Neon Borders & Bright Text */
  button, .btn, input[type="submit"], a[class*="btn"], a[style*="border"], a[href*="vault"], a[href*="logout"] {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;
    color: #38bdf8 !important;
    border: 1px solid #38bdf8 !important;
    font-family: 'Orbitron', sans-serif !important;
    font-weight: 700 !important;
    padding: 10px 18px !important;
    border-radius: 10px !important;
    text-decoration: none !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.2) !important;
  }
  button.primary-btn, button[type="submit"], a[href*="logout"] {
    background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%) !important;
    color: #e0f2fe !important;
  }
  /* Cards & Containers */
  .card, .panel, .auth-card, .login-card, .session-card {
    background: rgba(15, 23, 42, 0.92) !important;
    border: 1px solid rgba(56, 189, 248, 0.35) !important;
    border-radius: 16px !important;
    color: #cbd5e1 !important;
  }
  /* Inner Token / Output Boxes (Never White, Always Pitch Dark with Neon Green Text) */
  #tokenCard, .token-box, pre, code, [id*="output"], [id*="Out"], .terminal-box {
    background-color: #020617 !important;
    color: #4ade80 !important;
    font-family: 'JetBrains Mono', monospace !important;
    border: 1px solid rgba(74, 222, 128, 0.4) !important;
    border-radius: 10px !important;
  }
  /* Inputs & Textareas - Pitch Dark with Cyan Text and Visible Gray Examples (Placeholders) */
  input, textarea, select {
    background-color: #020617 !important;
    color: #38bdf8 !important;
    font-family: 'JetBrains Mono', monospace !important;
    border: 1px solid #334155 !important;
    border-radius: 10px !important;
  }
  input::placeholder, textarea::placeholder {
    color: #64748b !important;
    opacity: 1 !important;
  }
</style>

<script id="cyber-color-enforcer">
  function fixVisibilityAndWhiteBoxes() {
    document.querySelectorAll('*').forEach(el => {
      const style = window.getComputedStyle(el);
      const bg = style.backgroundColor;
      const fg = style.color;
      // 1. Turn any remaining white/light background into deep cyber dark
      const mBg = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (mBg && parseInt(mBg[1]) > 180 && parseInt(mBg[2]) > 180 && parseInt(mBg[3]) > 180) {
        el.style.setProperty('background', '#020617', 'important');
        el.style.setProperty('background-color', '#020617', 'important');
        el.style.setProperty('color', '#4ade80', 'important');
        el.style.setProperty('border', '1px solid #38bdf8', 'important');
      }
      // 2. Fix dark-on-dark invisible text (if text color is dark rgb < 65, make it bright cyan!)
      const mFg = fg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (mFg && parseInt(mFg[1]) < 65 && parseInt(mFg[2]) < 65 && parseInt(mFg[3]) < 65) {
        el.style.setProperty('color', '#38bdf8', 'important');
      }
    });
  }
  document.addEventListener('DOMContentLoaded', fixVisibilityAndWhiteBoxes);
  setInterval(fixVisibilityAndWhiteBoxes, 350);
</script>

{% extends "base.html" %}
{% block content %}



<div style="max-width: 900px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div class="card" style="padding: 28px; border-radius: 20px; margin-bottom: 24px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #eab308; background: rgba(234, 179, 8, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.25);">
            APK AUDITOR (STATIC ANALYSIS)
        </span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #38bdf8; margin: 12px 0 6px;">APK Package Inspector</h1>
        <p style="color: #94a3b8; font-size: 0.92rem; margin: 0;">Upload an APK to statically inspect package files, DEX containers, and resource counts.</p>

        <div style="margin-top: 24px; display: flex; gap: 10px;">
            <input type="file" id="apkFileInput" accept=".apk" 
                style="flex: 1; padding: 10px; border-radius: 12px; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.18); color: #38bdf8; font-size: 0.9rem;">
            <button onclick="uploadAndInspect()" id="uploadBtn" 
                style="padding: 12px 24px; background: #eab308; border: none; border-radius: 12px; color: #020617; font-weight: 700; font-size: 0.9rem; cursor: pointer;">
                Inspect Binary
            </button>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card" style="padding: 24px; border-radius: 20px;">
        <h3 style="color: #38bdf8; font-size: 1.05rem; margin: 0 0 12px;">Inspection Summary</h3>
        <div style="background: rgba(5, 9, 17, 0.95); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px;">
            <pre id="apkViewer" style="margin: 0; color: #eab308; font-family: monospace; font-size: 0.88rem; #0b1120-space: pre-wrap;">// Upload an APK file to view archive structure...</pre>
        </div>
    </div>
</div>

<script>
async function uploadAndInspect() {
    const fileField = document.getElementById('apkFileInput');
    const viewer = document.getElementById('apkViewer');
    const btn = document.getElementById('uploadBtn');

    if(!fileField.files[0]) return alert("Please select an .apk file");

    const formData = new FormData();
    formData.append('file', fileField.files[0]);

    btn.disabled = true;
    viewer.innerText = "// Parsing archive containers...";

    try {
        const resp = await fetch('/tools/apk-inspector', {
            method: 'POST',
            body: formData
        });
        const res = await resp.json();
        viewer.innerText = JSON.stringify(res, null, 2);
    } catch(err) {
        viewer.innerText = "// Audit inspection error: " + err.message;
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
