{% extends "base.html" %}
{% block content %}
<div style="max-width: 900px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div class="card" style="padding: 28px; border-radius: 20px; margin-bottom: 24px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #eab308; background: rgba(234, 179, 8, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.25);">
            APK AUDITOR (STATIC ANALYSIS)
        </span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #ffffff; margin: 12px 0 6px;">APK Package Inspector</h1>
        <p style="color: #94a3b8; font-size: 0.92rem; margin: 0;">Upload an APK to statically inspect package files, DEX containers, and resource counts.</p>

        <div style="margin-top: 24px; display: flex; gap: 10px;">
            <input type="file" id="apkFileInput" accept=".apk" 
                style="flex: 1; padding: 10px; border-radius: 12px; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 0.9rem;">
            <button onclick="uploadAndInspect()" id="uploadBtn" 
                style="padding: 12px 24px; background: #eab308; border: none; border-radius: 12px; color: #020617; font-weight: 700; font-size: 0.9rem; cursor: pointer;">
                Inspect Binary
            </button>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card" style="padding: 24px; border-radius: 20px;">
        <h3 style="color: #ffffff; font-size: 1.05rem; margin: 0 0 12px;">Inspection Summary</h3>
        <div style="background: rgba(5, 9, 17, 0.95); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px;">
            <pre id="apkViewer" style="margin: 0; color: #eab308; font-family: monospace; font-size: 0.88rem; white-space: pre-wrap;">// Upload an APK file to view archive structure...</pre>
        </div>
    </div>
</div>

<script>
async function uploadAndInspect() {
    const fileField = document.getElementById('apkFileInput');
    const viewer = document.getElementById('apkViewer');
    const btn = document.getElementById('uploadBtn');

    if(!fileField.files[0]) return alert("Please select an .apk file");

    const formData = new FormData();
    formData.append('file', fileField.files[0]);

    btn.disabled = true;
    viewer.innerText = "// Parsing archive containers...";

    try {
        const resp = await fetch('/tools/apk-inspector', {
            method: 'POST',
            body: formData
        });
        const res = await resp.json();
        viewer.innerText = JSON.stringify(res, null, 2);
    } catch(err) {
        viewer.innerText = "// Audit inspection error: " + err.message;
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
