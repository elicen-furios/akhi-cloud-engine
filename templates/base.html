<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} // AKHIL DEV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-surface: #fafafa;
            --bg-card: #ffffff;
            --border-soft: #e4e4e7;
            --border-focus: #18181b;
            --text-title: #09090b;
            --text-body: #52525b;
            --text-muted: #a1a1aa;
            --accent: #18181b;
            --accent-hover: #27272a;
            --accent-blue: #2563eb;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --font-ui: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", monospace;
            --shadow-subtle: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-body);
            color: var(--text-title);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            overflow-x: auto; width: 100%;
            -webkit-font-smoothing: antialiased;
        }
        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.25);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .drawer-overlay.active { display: block; }
        .sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 999;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .brand-box {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-soft);
        }
        .brand-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #18181b;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .brand-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text h2 { font-size: 0.95rem; font-weight: 700; color: var(--text-title); letter-spacing: -0.3px; }
        .brand-text p { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        .nav-list {
            list-style: none;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-section-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            padding: 12px 12px 6px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-body);
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item:hover { color: var(--text-title); background: #f4f4f5; }
        .nav-item.active {
            color: var(--text-title);
            background: #ffffff;
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-soft);
        }
        .sidebar-footer {
            padding: 18px;
            border-top: 1px solid var(--border-soft);
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
        }
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-body);
        }
        .header-bar {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 500;
        }
        .hamburger-btn {
            display: none;
            background: #fff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            color: var(--text-title);
            padding: 8px 10px;
            cursor: pointer;
        }
        .header-brand-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.3px;
            color: var(--text-title);
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 6px;
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-title);
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
            transition: 0.15s ease;
        }
        .user-badge:hover { border-color: var(--border-focus); }
        .user-avatar-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #18181b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .content-body {
            padding: 40px 48px;
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            word-wrap: break-word;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 28px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #18181b;
            color: #ffffff;
            font-family: var(--font-ui);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .btn-primary:hover { background: #27272a; transform: translateY(-1px); }
        .btn-secondary {
            background: #ffffff;
            color: var(--text-title);
            font-family: var(--font-ui);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover { background: #f4f4f5; border-color: #d4d4d8; }
        .input-text {
            width: 100%;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            color: var(--text-title);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            margin-bottom: 14px;
            outline: none;
            transition: all 0.15s ease;
        }
        .input-text:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(24,24,27,0.06); }
        .code-box {
            background: #fafafa;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: #18181b;
            overflow-x: auto;
            margin: 14px 0;
            line-height: 1.6;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 14px 0;
        }
        .data-table th, .data-table td {
            border-bottom: 1px solid var(--border-soft);
            padding: 12px 14px;
            text-align: left;
        }
        .data-table th { background: #fafafa; color: var(--text-title); font-weight: 600; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
            .hamburger-btn { display: block; }
            .header-bar { padding: 14px 20px; }
            .content-body { padding: 16px 12px; width: 100%; max-width: 100vw; box-sizing: border-box; }
        }
    
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            display: block;
            margin: 12px 0;
        }
        .code-box {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
            white-space: pre;
            word-break: normal;
        }

    </style>
</head>
<body>
    <div class="drawer-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand-box">
            <div class="brand-avatar">
                <img src="/public/image.png" onerror="this.onerror=null; this.src='/public/second-image.png';" alt="A">
            </div>
            <div class="brand-text">
                <h2>AKHIL DEV</h2>
                <p>Cloud Developer Platform</p>
            </div>
        </div>

        <ul class="nav-list">
            <li class="nav-section-title">CORE PLATFORM</li>
            <li><a href="/" class="nav-item {{ 'active' if active_page == 'home' else '' }}"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a></li>
            <li><a href="/api-keys" class="nav-item {{ 'active' if active_page == 'api-keys' else '' }}"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5L13 7l-1.5-1.5L10 7l-2-2-4 4 6 6 8-8z"/><circle cx="7.5" cy="16.5" r="1.5"/></svg><span>API Keys</span></a></li>
            <li><a href="/sandbox" class="nav-item {{ 'active' if active_page == 'sandbox' else '' }}"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span>Transmission Console</span></a></li>
            <li><a href="/media" class="nav-item {{ 'active' if active_page == 'media' else '' }}"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Media Vault</span></a></li>
            <li><a href="/docs" class="nav-item {{ 'active' if active_page == 'docs' else '' }}"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Protocol Docs</span></a></li>

            <li class="nav-section-title">SYSTEM INFRASTRUCTURE</li>
            <li><a href="/database" class="nav-item {{ 'active' if active_page == 'database' else '' }}"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><span>Database Engine</span></a></li>
            <li><a href="/system" class="nav-item {{ 'active' if active_page == 'system' else '' }}"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg><span>Telemetry Status</span></a></li>
            <li><a href="/login" class="nav-item {{ 'active' if active_page == 'login' else '' }}"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Identity Gate</span></a></li>
        </ul>

        <div class="sidebar-footer">
            DEVELOPER AKHIL &middot; PROD V2.4
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="header-bar">
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="header-brand-title">AKHIL DEV PLATFORM</div>
            </div>

            <a href="/login" class="user-badge">
                <div class="user-avatar-circle" id="user-initial">A</div>
                <span id="user-name-tag">SIGN IN</span>
            </a>
        </header>

        <div class="content-body">
            {{ content }}
        </div>
    </div>

    <!-- MODULAR FIREBASE AUTH -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithRedirect,
            getRedirectResult,
            GoogleAuthProvider, 
            GithubAuthProvider,
            signInWithPhoneNumber,
            RecaptchaVerifier,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBt_zPZndgJh82AK8tXWvOyN8ec3dY31KQ",
            authDomain: "free-api-web-2a7bc.firebaseapp.com",
            projectId: "free-api-web-2a7bc",
            storageBucket: "free-api-web-2a7bc.firebasestorage.app",
            messagingSenderId: "118488816924",
            appId: "1:118488816924:web:0d09754cf52cab3e00eed9",
            measurementId: "G-HFPR9X4EWK"
        };

        const app = initializeApp(firebaseConfig);
        try { getAnalytics(app); } catch(e){}
        const auth = getAuth(app);
        window.auth = auth;
        window.currentFirebaseUser = null;

        // Catch Google redirect back
        getRedirectResult(auth).then(result => {
            if (result && result.user) {
                window.location.href = "/api-keys";
            }
        }).catch(err => {
            console.error("Redirect Auth Error:", err);
            showLoginError("Google Sign-In failed: " + err.message);
        });

        onAuthStateChanged(auth, user => {
            window.currentFirebaseUser = user;
            const tag = document.getElementById("user-name-tag");
            const init = document.getElementById("user-initial");
            const loginForm = document.getElementById("login-box-card");
            const loggedCard = document.getElementById("logged-in-profile-card");
            const profileDisplay = document.getElementById("profile-display-info");

            if (user && (user.email || user.phoneNumber)) {
                const displayName = user.email || user.phoneNumber || user.displayName;
                if (tag) tag.innerText = (user.displayName || user.email?.split("@")[0] || "USER").toUpperCase();
                if (init) init.innerText = (user.displayName || user.email || "U").charAt(0).toUpperCase();
                if (loginForm) loginForm.style.display = "none";
                if (loggedCard) {
                    loggedCard.style.display = "block";
                    if (profileDisplay) profileDisplay.innerText = displayName;
                }
            } else {
                if (tag) tag.innerText = "SIGN IN";
                if (init) init.innerText = "A";
                if (loginForm) loginForm.style.display = "block";
                if (loggedCard) loggedCard.style.display = "none";
            }
        });

        window.loginGoogle = async () => {
            hideLoginError();
            try {
                const prov = new GoogleAuthProvider();
                prov.setCustomParameters({ prompt: "select_account" });
                await signInWithRedirect(auth, prov);
            } catch(e) {
                console.error(e);
                showLoginError("Unable to open Google login. Try again.");
            }
        };

        window.loginGithub = async () => {
            hideLoginError();
            try {
                const prov = new GithubAuthProvider();
                await signInWithRedirect(auth, prov);
            } catch(e) {
                console.error(e);
                showLoginError("GitHub sign-in redirection failed.");
            }
        };

        window.signOutAccount = async () => {
            await signOut(auth);
            window.location.reload();
        };

        function showLoginError(msg) {
            const errBox = document.getElementById("login-error-container");
            const errMsg = document.getElementById("login-error-msg");
            if (errBox && errMsg) {
                errMsg.innerText = msg;
                errBox.style.display = "flex";
            }
        }

        window.resetLoginAttempt = () => {
            const errBox = document.getElementById("login-error-container");
            if (errBox) errBox.style.display = "none";
            document.getElementById("phone-step-1").style.display = "block";
            document.getElementById("phone-step-2").style.display = "none";
        };

        function hideLoginError() {
            const errBox = document.getElementById("login-error-container");
            if (errBox) errBox.style.display = "none";
        }
    </script>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("overlay").classList.toggle("active");
        }
    </script>
</body>
</html>
