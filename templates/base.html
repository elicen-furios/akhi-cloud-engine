
<script>
const VOICES_DATA = [
    {
        id: "694f9389-aac1-45b6-b726-9d9369183238",
        name: "Aanya (Hindi Warm Dialogue)",
        sub: "Warm • Friendly • Natural",
        avatar: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=100&auto=format&fit=crop&q=80"
    },
    {
        id: "95856005-0332-41b0-9f45-6677c7b2756d",
        name: "Aditi (Hindi Expressive Narrator)",
        sub: "Expressive • Clear • Confident",
        avatar: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=100&auto=format&fit=crop&q=80"
    },
    {
        id: "25608d0a-9d92-4f36-a192-35805adbeab7",
        name: "Kabir (Hindi Confident Male)",
        sub: "Confident • Deep • Professional",
        avatar: "https://images.unsplash.com/photo-1563089145-599997674d42?w=100&auto=format&fit=crop&q=80"
    },
    {
        id: "fb26447f-308b-471e-8b00-8d9f042846b8",
        name: "Rohan (Deep Executive Male)",
        sub: "Deep • Calm • Authoritative",
        avatar: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=100&auto=format&fit=crop&q=80"
    },
    {
        id: "a0e998e3-1827-4a51-93e8-e25c57707322",
        name: "Sarah (Natural English US)",
        sub: "Natural • Friendly • Clear",
        avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&auto=format&fit=crop&q=80"
    }
];

let curVoiceId = VOICES_DATA[0].id;

function toggleVoiceMenu(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById("dark-voice-menu");
    if (!menu) return;
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function pickVoice(vId, e) {
    if (e) e.stopPropagation();
    curVoiceId = vId;
    const v = VOICES_DATA.find(x => x.id === vId);
    if (v) {
        const titleEl = document.getElementById("selected-voice-title");
        if (titleEl) titleEl.innerText = v.name;
    }
    renderVoiceList();
    const menu = document.getElementById("dark-voice-menu");
    if (menu) menu.style.display = "none";
}

function renderVoiceList() {
    const list = document.getElementById("dark-voice-list");
    if (!list) return;
    list.innerHTML = VOICES_DATA.map(v => {
        const isSel = v.id === curVoiceId;
        return `
            <div onclick="pickVoice('${v.id}', event)" style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:8px; cursor:pointer; margin-bottom:4px; ${isSel ? 'background:#1e293b; border:1px solid #3b82f6;' : 'background:transparent; border:1px solid transparent;'}">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${v.avatar}" style="width:38px; height:38px; border-radius:8px; object-fit:cover; border:1px solid #475569;">
                    <div>
                        <div style="color:#ffffff; font-size:0.88rem; font-weight:600;">${v.name}</div>
                        <div style="color:#94a3b8; font-size:0.75rem;">${v.sub}</div>
                    </div>
                </div>
                <div style="width:18px; height:18px; border-radius:50%; border:2px solid ${isSel ? '#3b82f6' : '#64748b'}; display:flex; align-items:center; justify-content:center;">
                    ${isSel ? '<div style="width:9px; height:9px; border-radius:50%; background:#3b82f6;"></div>' : ''}
                </div>
            </div>
        `;
    }).join("");
}

document.addEventListener("DOMContentLoaded", function() {
    // 1. Convert Voice input into a Dropdown Trigger button with Dark Popover
    const target = document.getElementById("voice-picker-btn") || document.getElementById("voice-id");
    if (target && target.parentElement) {
        const parent = target.parentElement;
        parent.style.position = "relative";
        parent.innerHTML = `
            <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Voice Model</label>
            <div id="voice-dropdown-box" onclick="toggleVoiceMenu(event)" style="display:flex; justify-content:space-between; align-items:center; width:100%; box-sizing:border-box; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px; padding:10px 14px; cursor:pointer; user-select:none;">
                <span id="selected-voice-title" style="font-weight:600; font-size:0.9rem; color:#0f172a;">Aanya (Hindi Warm Dialogue)</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>

            <!-- Dark Floating Popup Dropdown like Image 1 -->
            <div id="dark-voice-menu" style="display:none; position:absolute; top:calc(100% + 6px); left:0; width:100%; max-width:480px; background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:8px; box-shadow:0 10px 25px rgba(0,0,0,0.4); z-index:9999;">
                <div id="dark-voice-list"></div>
            </div>
        `;
        renderVoiceList();
    }

    // Close dropdown on outside click
    document.addEventListener("click", function(e) {
        const menu = document.getElementById("dark-voice-menu");
        const box = document.getElementById("voice-dropdown-box");
        if (menu && box && !box.contains(e.target) && !menu.contains(e.target)) {
            menu.style.display = "none";
        }
    });

    // 2. Audio Mastering Nodes
    let audioCtx = null, srcNode = null, panner = null, bassFilter = null;
    function setupMastering() {
        const audio = document.getElementById("audio-player");
        if (!audio) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!srcNode) {
            try {
                srcNode = audioCtx.createMediaElementSource(audio);
                panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.value = 220;

                if (panner) {
                    srcNode.connect(panner);
                    panner.connect(bassFilter);
                } else {
                    srcNode.connect(bassFilter);
                }
                bassFilter.connect(audioCtx.destination);
            } catch(e) {}
        }
    }

    // Sliders Event
    document.addEventListener("input", function(e) {
        setupMastering();
        const t = e.target;
        const v = parseFloat(t.value);
        if (t.id === "pan-slider" || t.min === "-1") {
            if (panner) panner.pan.value = v;
            const lbl = document.getElementById("pan-val");
            if (lbl) lbl.innerText = v === 0 ? "Center" : (v < 0 ? "Left " + Math.abs(Math.round(v*100)) + "%" : "Right " + Math.round(v*100) + "%");
        }
        if (t.id === "bass-slider" || t.min === "-10") {
            if (bassFilter) bassFilter.gain.value = v;
            const lbl = document.getElementById("bass-val");
            if (lbl) lbl.innerText = v + " dB";
        }
    });

    // Presets
    document.addEventListener("click", function(e) {
        const b = e.target.closest("button");
        if (!b) return;
        const txt = b.innerText.trim();
        setupMastering();
        if (txt.includes("Studio Dry") || txt.includes("Normal")) {
            if (panner) panner.pan.value = 0;
            if (bassFilter) bassFilter.gain.value = 0;
        } else if (txt.includes("Warm Bass") || txt.includes("Podcast")) {
            if (bassFilter) bassFilter.gain.value = 8;
        } else if (txt.includes("Left Ear 3D")) {
            if (panner) panner.pan.value = -0.85;
        } else if (txt.includes("Right Ear 3D")) {
            if (panner) panner.pan.value = 0.85;
        }
    });

    // 3. Audio Synthesis Execution
    const genBtn = document.getElementById("btn-gen-voice");
    if (genBtn) {
        genBtn.onclick = async function(e) {
            if (e) e.preventDefault();
            const text = (document.getElementById("voice-text")?.value || "").trim();
            if (!text) {
                alert("Please enter script text first");
                return;
            }
            const orig = genBtn.innerHTML;
            genBtn.disabled = true;
            genBtn.innerHTML = "<span>Synthesizing Voice...</span>";

            try {
                const res = await fetch("/api/tts-generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text, voice_id: curVoiceId })
                });

                if (!res.ok) throw new Error("HTTP " + res.status);
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const p = document.getElementById("audio-player");
                const cont = document.getElementById("player-container");
                const dl = document.getElementById("btn-download");

                if (cont) cont.style.display = "block";
                if (dl) dl.href = url;
                if (p) {
                    p.src = url;
                    p.load();
                    setupMastering();
                    await p.play().catch(() => {});
                }
            } catch(err) {
                alert("Synthesis Failed: " + err.message);
            } finally {
                genBtn.disabled = false;
                genBtn.innerHTML = orig;
            }
        };
    }
});
</script>
