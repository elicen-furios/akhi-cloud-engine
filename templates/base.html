<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }} // AKHIL DEV</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-surface: #fafafa;
            --bg-card: #ffffff;
            --border-soft: #e4e4e7;
            --text-title: #09090b;
            --text-body: #52525b;
            --text-muted: #a1a1aa;
            --font-ui: "Plus Jakarta Sans", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
            --shadow-subtle: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-body);
            color: var(--text-title);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.35);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .drawer-overlay.active { display: block; }
        .sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 999;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .brand-box {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-soft);
        }
        .brand-avatar {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: #18181b;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-soft);
        }
        .brand-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text h2 { font-size: 0.95rem; font-weight: 700; color: var(--text-title); }
        .brand-text p { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }
        .nav-list {
            list-style: none;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-section-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            padding: 12px 12px 6px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-body);
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-title);
            background: #ffffff;
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-soft);
        }
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }
        .header-bar {
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 500;
        }
        .hamburger-btn {
            display: none;
            background: #fff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            color: var(--text-title);
            padding: 6px 10px;
            cursor: pointer;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-title);
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
        }
        .user-avatar-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #18181b;
            color: #ffffff;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .content-body {
            padding: 32px 24px;
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 28px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 24px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .btn-primary {
            background: #18181b;
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary {
            background: #ffffff;
            color: var(--text-title);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .input-text {
            width: 100%;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            outline: none;
        }
        .code-box {
            background: #fafafa;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: pre;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .data-table th, .data-table td {
            border-bottom: 1px solid var(--border-soft);
            padding: 12px 14px;
            text-align: left;
        }
        /* Error Toast */
        #custom-toast {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 1px solid #fecaca;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15);
            border-radius: 12px;
            padding: 12px 18px;
            z-index: 99999;
            align-items: center;
            gap: 10px;
        }
        .toast-pill {
            background: #fef2f2;
            color: #ef4444;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #fecaca;
        }
        /* Animated Done Modal */
        #done-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .done-box {
            background: #fff;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            border-radius: 16px;
            padding: 32px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
            .hamburger-btn { display: block; }
            .content-body { padding: 20px 14px; }
        }
    </style>
</head>
<body>
    <div class="drawer-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand-box">
            <div class="brand-avatar">
                <img src="/image.png?v=3" onerror="this.onerror=null; this.src='/logo.png';" alt="Logo">
            </div>
            <div class="brand-text">
                <h2>AKHIL DEV</h2>
                <p>Developer Platform</p>
            </div>
        </div>

        <ul class="nav-list">
            <li class="nav-section-title">CORE PLATFORM</li>
            <li><a href="/" class="nav-item {{ 'active' if active_page == 'home' else '' }}"><span>Home</span></a></li>
            <li><a href="/api-keys" class="nav-item {{ 'active' if active_page == 'api-keys' else '' }}"><span>API Keys</span></a></li>
            <li><a href="/sandbox" class="nav-item {{ 'active' if active_page == 'sandbox' else '' }}"><span>Transmission Console</span></a></li>
            <li><a href="/media" class="nav-item {{ 'active' if active_page == 'media' else '' }}"><span>Media Vault</span></a></li>
            <li><a href="/docs" class="nav-item {{ 'active' if active_page == 'docs' else '' }}"><span>Protocol Docs</span></a></li>

            <li class="nav-section-title">SYSTEM INFRASTRUCTURE</li>
            <li><a href="/database" class="nav-item {{ 'active' if active_page == 'database' else '' }}"><span>Database Engine</span></a></li>
            <li><a href="/system" class="nav-item {{ 'active' if active_page == 'system' else '' }}"><span>Telemetry Status</span></a></li>
            <li><a href="/login" class="nav-item {{ 'active' if active_page == 'login' else '' }}"><span>Identity Gate</span></a></li>
        </ul>
    </aside>

    <div class="main-wrapper">
        <header class="header-bar">
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
                <div style="font-weight:700; font-size:0.95rem;">AKHIL DEV PLATFORM</div>
            </div>

            <a href="/login" class="user-badge" id="header-user-btn">
                <div class="user-avatar-circle" id="user-initial"></div>
                <span id="user-name-tag">Sign In</span>
            </a>
        </header>

        <div class="content-body">
            {{ content }}
        </div>
    </div>

    <!-- Error Toast -->
    <div id="custom-toast">
        <span class="toast-pill">ERROR</span>
        <span id="toast-text" style="font-size:0.84rem; font-weight:500;"></span>
    </div>

    <!-- Done Modal -->
    <div id="done-screen">
        <div class="done-box">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <h2 style="font-size:1.3rem; font-weight:800;">Done</h2>
            <p id="done-user-label" style="font-size:0.85rem; color:#71717a;">Authenticated successfully</p>
        </div>
    </div>

    <!-- Toast Helper -->
    <script>
        window.showToast = function(msg) {
            const toast = document.getElementById("custom-toast");
            const text = document.getElementById("toast-text");
            if (!toast || !text) return;
            text.innerText = msg;
            toast.style.display = "flex";
            setTimeout(() => { toast.style.display = "none"; }, 3200);
        };
        window.alert = function(msg) { window.showToast(msg); };
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("overlay").classList.toggle("active");
        }
    </script>

    <!-- Modular Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithPopup,
            signInWithRedirect,
            getRedirectResult,
            GoogleAuthProvider, 
            GithubAuthProvider,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBt_zPZndgJh82AK8tXWvOyN8ec3dY31KQ",
            authDomain: "free-api-web-2a7bc.firebaseapp.com",
            projectId: "free-api-web-2a7bc",
            storageBucket: "free-api-web-2a7bc.firebasestorage.app",
            messagingSenderId: "118488816924",
            appId: "1:118488816924:web:0d09754cf52cab3e00eed9",
            measurementId: "G-HFPR9X4EWK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.auth = auth;
        window.currentFirebaseUser = null;

        function showDoneAndRedirect(name) {
            const screen = document.getElementById("done-screen");
            const lbl = document.getElementById("done-user-label");
            if (lbl) lbl.innerText = "Welcome, " + name;
            if (screen) {
                screen.style.display = "flex";
                setTimeout(() => {
                    screen.style.display = "none";
                    window.location.href = "/api-keys";
                }, 1400);
            }
        }

        getRedirectResult(auth).then(res => {
            if (res && res.user) {
                const name = res.user.displayName || res.user.email?.split("@")[0] || "User";
                showDoneAndRedirect(name);
            }
        }).catch(err => {
            window.showToast("Login error: " + err.message);
        });

        onAuthStateChanged(auth, user => {
            window.currentFirebaseUser = user;
            const tag = document.getElementById("user-name-tag");
            const init = document.getElementById("user-initial");
            const loginForm = document.getElementById("login-box-card");
            const loggedCard = document.getElementById("logged-in-profile-card");
            const profileDisplay = document.getElementById("profile-display-info");

            if (user) {
                const name = user.displayName || user.email?.split("@")[0] || "User";
                const firstChar = name.trim().charAt(0).toUpperCase();
                if (tag) tag.innerText = name.toUpperCase();
                if (init) {
                    init.innerText = firstChar;
                    init.style.display = "flex";
                }
                if (loginForm) loginForm.style.display = "none";
                if (loggedCard) {
                    loggedCard.style.display = "block";
                    if (profileDisplay) profileDisplay.innerText = user.email || user.phoneNumber || name;
                }
            } else {
                if (tag) tag.innerText = "Sign In";
                if (init) {
                    init.innerText = "";
                    init.style.display = "none";
                }
                if (loginForm) loginForm.style.display = "block";
                if (loggedCard) loggedCard.style.display = "none";
            }
        });

        window.loginGoogle = async () => {
            const prov = new GoogleAuthProvider();
            prov.setCustomParameters({ prompt: "select_account" });
            try {
                const res = await signInWithPopup(auth, prov);
                if (res && res.user) {
                    const name = res.user.displayName || res.user.email?.split("@")[0] || "User";
                    showDoneAndRedirect(name);
                }
            } catch(e) {
                // If popup was blocked by mobile browser, switch to redirect
                if (e.code === "auth/popup-blocked" || e.code === "auth/cancelled-popup-request") {
                    await signInWithRedirect(auth, prov);
                } else {
                    window.showToast("Google Login failed: " + e.message);
                }
            }
        };

        window.loginGithub = async () => {
            const prov = new GithubAuthProvider();
            try {
                const res = await signInWithPopup(auth, prov);
                if (res && res.user) {
                    const name = res.user.displayName || "User";
                    showDoneAndRedirect(name);
                }
            } catch(e) {
                await signInWithRedirect(auth, prov);
            }
        };

        window.signOutAccount = async () => {
            await signOut(auth);
            window.location.reload();
        };
    </script>
</body>
</html>
