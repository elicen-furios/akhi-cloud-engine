<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style id="global-zero-white-override">
  /* 1. Global Font & Zero-White Text Replacement */
  * {
    font-family: 'Space Grotesk', sans-serif !important;
  }
  h1, h2, h3, .brand, .logo, nav a {
    font-family: 'Orbitron', sans-serif !important;
    color: #38bdf8 !important; /* Neon Cyan instead of White */
    letter-spacing: 0.04em !important;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.25) !important;
  }
  h4, h5, h6, label, th, strong, b {
    color: #a5b4fc !important; /* Soft Indigo-Cyan */
    font-weight: 700 !important;
  }
  p, span, td, li, small, div {
    color: #94a3b8; /* Muted Cyber Slate */
  }
  code, pre, .token, [id*="token"], [class*="token"] {
    font-family: 'JetBrains Mono', monospace !important;
    color: #4ade80 !important; /* Matrix Neon Green */
  }

  /* 2. Force Dark Cyber Backgrounds on Everything */
  html, body {
    background-color: #050811 !important;
    color: #38bdf8 !important;
  }

  /* 3. Nuclear Fix for ANY White Box inside Cards (Including NEW TOKEN GENERATED) */
  .card div, .panel div, main div, section div, form div,
  .auth-card, .login-card, .signup-card, .modal-content {
    background-color: #0b1120 !important;
    border-color: rgba(56, 189, 248, 0.25) !important;
  }

  /* Make outer cards slightly distinct from inner boxes */
  .card, .panel, .auth-box, .login-box, .signup-box {
    background: linear-gradient(145deg, #0f172a 0%, #090d16 100%) !important;
    border: 1px solid rgba(56, 189, 248, 0.35) !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8) !important;
  }

  /* Specifically style inner boxes inside cards (like NEW TOKEN GENERATED box) */
  .card > div, .card form > div, [id*="result"], [id*="output"], [id*="token"], [class*="box"], [class*="alert"] {
    background: #030712 !important;
    background-color: #030712 !important;
    border: 1px solid rgba(74, 222, 128, 0.4) !important;
    border-radius: 12px !important;
    color: #4ade80 !important;
  }

  /* 4. Inputs, Selects, Textareas */
  input, select, textarea {
    background: #020617 !important;
    background-color: #020617 !important;
    color: #38bdf8 !important;
    font-family: 'JetBrains Mono', monospace !important;
    border: 1px solid #1e293b !important;
    border-radius: 10px !important;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.3) !important;
  }

  /* 5. Buttons */
  button, .btn, input[type="submit"] {
    background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%) !important;
    color: #e0f2fe !important;
    font-family: 'Orbitron', sans-serif !important;
    font-size: 0.85rem !important;
    letter-spacing: 0.05em !important;
    border: 1px solid rgba(56, 189, 248, 0.5) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35) !important;
  }
</style>

<script id="cyber-color-enforcer">
  // Live scanner that kills any dynamic white background or white text instantly
  function enforceCyberTheme() {
    document.querySelectorAll('*').forEach(el => {
      const style = window.getComputedStyle(el);
      const bg = style.backgroundColor;
      const fg = style.color;
      // If background is white or very light gray (rgb values > 200)
      const m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (m && parseInt(m[1]) > 180 && parseInt(m[2]) > 180 && parseInt(m[3]) > 180) {
        el.style.setProperty('background', '#030712', 'important');
        el.style.setProperty('background-color', '#030712', 'important');
        el.style.setProperty('border', '1px solid rgba(56, 189, 248, 0.4)', 'important');
        el.style.setProperty('color', '#4ade80', 'important');
      }
      // If text color is pure white, shift to Cyber Cyan or Neon Green
      if (fg === 'rgb(255, 255, 255)') {
        if (['H1','H2','H3','TH','BUTTON','A'].includes(el.tagName)) {
          el.style.setProperty('color', '#38bdf8', 'important');
        } else {
          el.style.setProperty('color', '#a5f3fc', 'important');
        }
      }
    });
  }
  document.addEventListener('DOMContentLoaded', enforceCyberTheme);
  setInterval(enforceCyberTheme, 400);
</script>

{% extends "base.html" %}
{% block content %}



<div style="max-width: 900px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div class="card" style="padding: 28px; border-radius: 20px; margin-bottom: 24px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #fb923c; background: rgba(251, 146, 60, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(251, 146, 60, 0.25);">
            API ANY-BRIDGE SUITE
        </span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #0b1120; margin: 12px 0 6px;">Universal Web to JSON Bridge</h1>
        <p style="color: #94a3b8; font-size: 0.92rem; margin: 0;">Extract live structured JSON from target websites without official API keys.</p>

        <div style="margin-top: 24px; display: flex; gap: 10px;">
            <input type="text" id="targetUrlInput" placeholder="https://example.com" 
                style="flex: 1; padding: 12px 16px; border-radius: 12px; background: rgba(10, 16, 28, 0.85); border: 1px solid rgba(255,255,255,0.18); color: #0b1120; font-size: 0.92rem; outline: none;">
            <button onclick="runExtraction()" id="runBtn" 
                style="padding: 12px 24px; background: #38bdf8; border: none; border-radius: 12px; color: #020617; font-weight: 700; font-size: 0.9rem; cursor: pointer;">
                Extract JSON
            </button>
        </div>
    </div>

    <!-- Output Glass Box -->
    <div class="card" style="padding: 24px; border-radius: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="color: #0b1120; font-size: 1.05rem; margin: 0;">Extraction Result</h3>
            <span id="statusBadge" style="font-size: 0.76rem; color: #64748b;">Idle</span>
        </div>
        <div style="background: rgba(5, 9, 17, 0.95); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px; min-height: 200px;">
            <pre id="jsonViewer" style="margin: 0; color: #38bdf8; font-family: monospace; font-size: 0.88rem; #0b1120-space: pre-wrap; overflow-x: auto;">// Extracted JSON output will appear here...</pre>
        </div>
    </div>
</div>

<script>
async function runExtraction() {
    const url = document.getElementById('targetUrlInput').value.trim();
    const viewer = document.getElementById('jsonViewer');
    const badge = document.getElementById('statusBadge');
    const btn = document.getElementById('runBtn');

    if(!url) return alert("Please enter a target URL");

    badge.innerText = "Extracting...";
    badge.style.color = "#fb923c";
    btn.disabled = true;

    try {
        const resp = await fetch('/tools/api-bridge', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: url})
        });
        const res = await resp.json();
        viewer.innerText = JSON.stringify(res, null, 2);
        badge.innerText = "Completed (200)";
        badge.style.color = "#4ade80";
    } catch(err) {
        viewer.innerText = "// Extraction failed: " + err.message;
        badge.innerText = "Error";
        badge.style.color = "#f43f5e";
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
