<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Recon Suite — Akhil Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px 16px;
            min-height: 100vh;
        }
        .container { max-width: 850px; margin: 0 auto; }
        .back-nav { margin-bottom: 20px; }
        .back-nav a { color: #0ea5e9; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .card {
            background: #111827;
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-block;
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        @media(min-width: 600px) { .input-group { flex-direction: row; } }
        input[type="text"] {
            flex: 1; padding: 14px 16px; background: #030712;
            border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 1rem; outline: none;
        }
        input[type="text"]:focus { border-color: #0ea5e9; }
        button {
            padding: 14px 24px; background: #0ea5e9; color: #030712;
            font-weight: 700; font-size: 1rem; border: none; border-radius: 10px; cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .terminal-box {
            background: #030712; border: 1px solid #1f2937; border-radius: 10px;
            padding: 16px; min-height: 250px; max-height: 450px; overflow-y: auto;
        }
        pre { color: #38bdf8; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="/">&larr; Back to Platform Home</a></div>
        <div class="card">
            <span class="badge">DNS & Security Header Discovery</span>
            <h1>Domain Recon Suite</h1>
            <p>Target domain enter karein aur live IP resolution ke sath active security headers inspect karein.</p>
            <div class="input-group">
                <input type="text" id="domainInput" placeholder="github.com" value="github.com">
                <button id="reconBtn" onclick="runRecon()">Inspect Domain</button>
            </div>
        </div>
        <div class="card">
            <div class="terminal-header">
                <h3 style="font-size: 1.1rem; color: #fff;">Resolution Output</h3>
                <span id="statusTag" style="color: #64748b; font-size: 0.85rem; font-weight: 600;">System Ready</span>
            </div>
            <div class="terminal-box">
                <pre id="outputView">// Target resolution yahan aayegi...</pre>
            </div>
        </div>
    </div>
    <script>
        async function runRecon() {
            const domain = document.getElementById('domainInput').value.trim();
            const output = document.getElementById('outputView');
            const status = document.getElementById('statusTag');
            const btn = document.getElementById('reconBtn');
            if(!domain) return alert("Domain required");
            status.innerText = "Querying DNS & HTTP headers...";
            status.style.color = "#fb923c";
            btn.disabled = true;
            output.innerText = "// Resolving IPv4 and inspecting handshake response...";
            try {
                const res = await fetch('/tools/domain-recon', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({domain: domain})
                });
                const data = await res.json();
                output.innerText = JSON.stringify(data, null, 2);
                status.innerText = "Target Resolved";
                status.style.color = "#4ade80";
            } catch(e) {
                output.innerText = "// Recon error: " + e.message;
                status.innerText = "Error";
                status.style.color = "#ef4444";
            } finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
