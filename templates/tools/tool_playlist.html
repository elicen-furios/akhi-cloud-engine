<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Metadata Exporter — Akhil Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px 16px; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; }
        .back-nav a { color: #f43f5e; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        .card { background: #111827; border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .badge { display: inline-block; background: rgba(244, 63, 94, 0.15); color: #fb7185; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px 14px; background: #030712; border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 12px; outline: none; }
        textarea { width: 100%; height: 90px; padding: 12px 14px; background: #030712; border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
        button { padding: 14px 24px; background: #f43f5e; color: #fff; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
        .terminal-box { background: #030712; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; min-height: 220px; }
        pre { color: #fb7185; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="/">&larr; Back to Platform Home</a></div>
        <div class="card">
            <span class="badge">Audio Tools Engine</span>
            <h1>Playlist Metadata Exporter</h1>
            <p>Generate clean cue sheets, standardized metadata JSON, and M3U8 exports for lossless tracks.</p>
            <input type="text" id="plTitle" placeholder="Playlist Title" value="Cyber Ambient 2026">
            <textarea id="plTracks" placeholder="Enter tracks (comma separated or newline)">Midnight City, Resonance, Starboy, After Dark</textarea>
            <button onclick="compilePlaylist()">Generate M3U8 & Schema</button>
        </div>
        <div class="card">
            <h3 style="color:#fff; font-size:1.1rem; margin-bottom:10px;">Generated Output</h3>
            <div class="terminal-box"><pre id="outputLog">// Formatted schema will appear here...</pre></div>
        </div>
    </div>
    <script>
        async function compilePlaylist() {
            const t = document.getElementById('plTitle').value.trim();
            const tr = document.getElementById('plTracks').value.trim();
            const res = await fetch('/tools/playlist-generator', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: t, tracks: tr})
            });
            const data = await res.json();
            document.getElementById('outputLog').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
