<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request Reverser — Akhil Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px 16px; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; }
        .back-nav a { color: #a855f7; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        .card { background: #111827; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .badge { display: inline-block; background: rgba(168, 85, 247, 0.15); color: #c084fc; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; padding: 14px 16px; background: #030712; border: 1px solid #374151; border-radius: 10px; color: #fff; font-family: monospace; font-size: 0.9rem; outline: none; margin-bottom: 12px; }
        button { padding: 14px 24px; background: #a855f7; color: #fff; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
        .terminal-box { background: #030712; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; min-height: 250px; }
        pre { color: #c084fc; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="/">&larr; Back to Platform Home</a></div>
        <div class="card">
            <span class="badge">Reverse Engineering Suite</span>
            <h1>API Request Reverser</h1>
            <p>Paste any browser cURL network snippet to convert into a working Python script.</p>
            <textarea id="curlInput">curl -X GET "https://jsonplaceholder.typicode.com/posts/1" -H "Accept: application/json"</textarea>
            <button onclick="reverseCmd()">Reverse to Python Client</button>
        </div>
        <div class="card">
            <h3 style="color:#fff; font-size:1.1rem; margin-bottom:10px;">Generated Python Code</h3>
            <div class="terminal-box"><pre id="outputLog">// Generated code will appear here...</pre></div>
        </div>
    </div>
    <script>
        async function reverseCmd() {
            const c = document.getElementById('curlInput').value.trim();
            if(!c) return alert("cURL required");
            const res = await fetch('/tools/request-reverser', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({curl: c})
            });
            const data = await res.json();
            document.getElementById('outputLog').innerText = data.executable_python || JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
