{% extends "base.html" %}
{% block content %}
<div style="max-width: 920px; margin: 30px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div class="card" style="padding: 28px; border-radius: 20px; margin-bottom: 22px;">
        <span style="font-size: 0.74rem; font-weight: 700; color: #a855f7; background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);">
            REVERSE API WORKSTATION
        </span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #ffffff; margin: 12px 0 6px;">cURL & HTTP Network Reverser</h1>
        <p style="color: #94a3b8; font-size: 0.92rem; margin: 0 0 20px;">Transform browser cURL commands into production Python code clients.</p>
        <textarea id="curlCmd" placeholder="curl -X GET 'https://api.example.com/v1/data'" style="width:100%; height:90px; padding:12px; border-radius:10px; background:#0b1120; border:1px solid #334155; color:#fff; box-sizing:border-box; margin-bottom:10px;"></textarea><button onclick="execute()" style="padding:12px 24px; background:#a855f7; border:none; border-radius:10px; font-weight:700; cursor:pointer; color:#fff;">Reverse to Python</button>
    </div>
    <div class="card" style="padding: 24px; border-radius: 20px;">
        <h3 style="color: #ffffff; font-size: 1.05rem; margin: 0 0 12px;">Live Operational Output</h3>
        <div style="background: rgba(5, 9, 17, 0.95); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px; min-height: 180px;">
            <pre id="outputConsole" style="margin: 0; color: #a855f7; font-family: monospace; font-size: 0.88rem; white-space: pre-wrap; overflow-x: auto;">// Awaiting execution trigger...</pre>
        </div>
    </div>
</div>
<script>async function execute(){ const c = document.getElementById("curlCmd").value; const r = await fetch("/tools/request-reverser", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({curl:c})}); document.getElementById("outputConsole").innerText = JSON.stringify(await r.json(), null, 2); }</script>
{% endblock %}
