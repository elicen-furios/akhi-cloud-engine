<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiVault Key Auditor — Akhil Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px 16px; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; }
        .back-nav a { color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        .card { background: #111827; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px 16px; background: #030712; border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 12px; }
        button { padding: 14px 24px; background: #38bdf8; color: #030712; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
        .terminal-box { background: #030712; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; min-height: 220px; }
        pre { color: #38bdf8; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="/">&larr; Back to Platform Home</a></div>
        <div class="card">
            <span class="badge">ApiVault Key Intelligence</span>
            <h1>ApiVault Secret Auditor</h1>
            <p>API keys aur tokens ka Shannon entropy score aur security strength inspect karein.</p>
            <input type="text" id="secretKey" placeholder="Paste your API key or token here..." value="akhi_sample_api_token_audit_test">
            <button onclick="auditSecret()">Audit Key</button>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <h3 style="color:#fff; font-size:1.1rem;">Entropy Evaluation</h3>
                <span id="statusTag" style="color:#64748b; font-size:0.85rem;">Ready</span>
            </div>
            <div class="terminal-box"><pre id="outputLog">// Output evaluation yahan show hogi...</pre></div>
        </div>
    </div>
    <script>
        async function auditSecret() {
            const k = document.getElementById('secretKey').value.trim();
            if(!k) return alert("Key required");
            const res = await fetch('/tools/api-vault', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: k})
            });
            const data = await res.json();
            document.getElementById('outputLog').innerText = JSON.stringify(data, null, 2);
            document.getElementById('statusTag').innerText = "Evaluation Done";
            document.getElementById('statusTag').style.color = "#4ade80";
        }
    </script>
</body>
</html>
